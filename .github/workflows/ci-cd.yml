# =====================================================================
# PIPELINE CI/CD - GitHub Actions
# Roda sozinho a cada "push" ou "pull request" na branch main.
#
#   1. CI  - compila a API (se tiver erro, o pipeline para aqui)
#   2. CI  - monta a imagem Docker e, no push, publica no GitHub
#            Container Registry (ghcr.io)
#   3. CD  - implanta a imagem nova no Azure App Service
#            (só roda depois que a variável AZURE_WEBAPP_NAME e o segredo
#             AZURE_CREDENTIALS forem configurados no repositório)
# =====================================================================
name: CI/CD TechBuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJETO: "TechHouse Industry/TechHouse Industry/TechHouse Industry.csproj"

jobs:
  build:
    name: 1. Compilar a API
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar pacotes NuGet
        run: dotnet restore "$PROJETO"

      - name: Compilar em modo Release
        run: dotnet build "$PROJETO" --configuration Release --no-restore

      - name: Conferir se os scripts do banco estão no repositório
        run: |
          test -f bancoPIM_completo.sql
          test -f banco_etapa7_procedures_triggers.sql

  docker:
    name: 2. Gerar e publicar a imagem Docker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Definir o nome da imagem (o registro exige letras minúsculas)
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/techbuild-api" >> "$GITHUB_OUTPUT"

      - name: Montar a imagem
        run: |
          docker build \
            -t "${{ steps.nome.outputs.imagem }}:${{ github.sha }}" \
            -t "${{ steps.nome.outputs.imagem }}:latest" \
            "TechHouse Industry"

      - name: Entrar no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.nome.outputs.imagem }}:${{ github.sha }}"
          docker push "${{ steps.nome.outputs.imagem }}:latest"

  deploy:
    name: 3. Implantar no Azure App Service
    needs: docker
    if: github.event_name == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Entrar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar o App Service com a imagem nova
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ needs.docker.outputs.imagem }}:${{ github.sha }}

      - name: Conferir se a API subiu (monitoramento)
        run: |
          sleep 30
          curl --fail "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
